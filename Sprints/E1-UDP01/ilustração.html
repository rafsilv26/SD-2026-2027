<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliver them in any order</title>
<!-- Standalone: no external files required. The Google Fonts request below is a
     progressive enhancement loaded without blocking rendering; offline, or on a
     machine with no network, the page falls back to the system fonts declared in
     --sans / --serif and works exactly the same.
     NOTE: this stylesheet is an inlined copy of ../styles/widget.css. If that
     shared file changes, re-inline it here. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Shared by every widget in widgets/. Keeping this out of the individual files
   is what stops twenty widgets from drifting into twenty visual identities.
   Token meanings are documented in STYLE.md. */

:root{
  --ink:#0E1A21;
  --ink-2:#14242D;
  --rule:#27404C;
  --type:#C6D6DC;
  --type-dim:#7A96A3;
  --minority:#D9943A;
  --majority:#3FA894;
  --danger:#C04A3F;
  --sans:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:1.25rem;
  background:var(--ink);
  color:var(--type);
  font-family:var(--serif);
  font-size:18px;          /* projector floor — see STYLE.md */
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

h1{
  font-family:var(--sans);
  font-weight:500;
  font-size:1.15rem;
  letter-spacing:-.02em;
  margin:0 0 1rem;
}

/* Controls ---------------------------------------------------------------- */

.controls{
  display:flex;
  gap:2rem;
  flex-wrap:wrap;
  align-items:center;
  padding-bottom:1rem;
  border-bottom:1px solid var(--rule);
  margin-bottom:1rem;
}

.control{display:flex;flex-direction:column;gap:.3rem;min-width:190px}

.control label{
  font-family:var(--sans);
  font-size:.72rem;
  color:var(--type-dim);
}

.control output{
  font-family:var(--sans);
  font-size:.95rem;
  color:var(--type);
}

input[type=range]{
  accent-color:var(--majority);
  width:100%;
  background:transparent;
}

/* Readouts ---------------------------------------------------------------- */

.readout{
  display:flex;
  gap:1rem;
  flex-wrap:wrap;
  margin-top:1rem;
}

.card{
  flex:1 1 200px;
  border-top:2px solid var(--rule);
  padding-top:.6rem;
}
.card.min{border-top-color:var(--minority)}
.card.maj{border-top-color:var(--majority)}

.card h2{
  font-family:var(--sans);
  font-weight:500;
  font-size:.8rem;
  margin:0 0 .25rem;
  color:var(--type-dim);
}

.card .verdict{font-family:var(--sans);font-size:1rem}
.verdict.commits{color:var(--majority)}
.verdict.stalls{color:var(--minority)}

.takeaway{
  margin-top:1.25rem;
  border-left:2px solid var(--rule);
  padding-left:1rem;
  color:var(--type-dim);
  font-size:.92rem;
  max-width:62ch;
}
.takeaway strong{color:var(--type);font-weight:600}

/* Diagram ----------------------------------------------------------------- */

svg{width:100%;height:auto;display:block;overflow:visible}

.node circle{fill:var(--ink-2);stroke:var(--rule);stroke-width:1.5;transition:stroke .35s,fill .35s}
.node text{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--type);
           text-anchor:middle;dominant-baseline:central}
.node.min circle{stroke:var(--minority)}
.node.maj circle{stroke:var(--majority)}
.node.shared circle{fill:var(--majority);stroke:var(--majority)}
.node.shared text{fill:var(--ink)}

.cut{stroke:var(--danger);stroke-width:2;stroke-dasharray:7 9}
.cut-label{font-family:var(--sans);font-size:11px;fill:var(--danger);text-anchor:middle}

/* Datagram tray + transcript ---------------------------------------------- */

.tray{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}

.dgram{
  font-family:var(--sans);
  font-size:1rem;
  color:var(--type);
  background:var(--ink-2);
  border:1.5px solid var(--rule);
  border-radius:2px;
  padding:.5rem .9rem;
  cursor:pointer;
  transition:border-color .25s,color .25s;
}
.dgram:hover{border-color:var(--type-dim)}
.dgram.done{border-color:var(--majority);color:var(--majority)}
.dgram.next{border-color:var(--minority);color:var(--minority)}
.dgram.reset{color:var(--type-dim);margin-left:auto}

.log{
  list-style:none;
  margin:1rem 0 0;
  padding:.6rem 0 0;
  border-top:1px solid var(--rule);
  font-family:var(--sans);
  font-size:.88rem;
  height:150px;
  overflow-y:auto;
}
.log li{display:flex;gap:.7rem;padding:.1rem 0}
.log .dir{color:var(--type-dim);flex:none;width:1.1rem}
.log .accept{color:var(--majority)}
.log .refuse{color:var(--minority)}

:focus-visible{outline:2px solid var(--minority);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>

<h1>Deliver them in any order</h1>

<div class="tray" id="tray" role="group" aria-label="Datagrams the client can send"></div>

<div class="readout">
  <div class="card maj">
    <h2>Server state</h2>
    <div class="verdict commits" id="verdict-l"></div>
  </div>
  <div class="card min">
    <h2>Last reply</h2>
    <div class="verdict" id="verdict-reply"></div>
  </div>
  <div class="card">
    <h2>Datagrams sent</h2>
    <div class="verdict" id="verdict-sent"></div>
  </div>
</div>

<ul class="log" id="log" aria-live="polite" aria-label="Transcript"></ul>

<p class="takeaway" id="takeaway"></p>

<script>
// ---------------------------------------------------------------------------
// CONFIG — every number and string a revision might touch lives here.
// Rendering and interaction logic below should rarely need editing.
// ---------------------------------------------------------------------------
const CONFIG = {
  // One entry per datagram the client can send, in sequence-number order.
  payloads: ["alpha", "beta", "gamma", "delta", "epsilon"],
  startL: 0,
  wire:   { send: (n, p) => `${n},${p}` },
  reply:  {
    accept: n => `ok,${n}`,
    refuse: l => `waitingfor,${l + 1}`
  },
  copy: {
    state:    l => `L = ${l}`,
    sent:     n => `${n}`,
    none:     "—",
    reset:    "Reset server",
    caption:  l => `L = ${l}. The only datagram this server will accept is ${l + 1}.`,
    complete: l => `L = ${l}. Every message has been accepted in order.`
  }
};

// ---------------------------------------------------------------------------
// Logic
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const tray = $("tray"), log = $("log");

let L, sent;

function reset() {
  L = CONFIG.startL;
  sent = 0;
  log.innerHTML = "";
  render();
}

// The server. One integer of state, one comparison.
function receive(n) {
  if (n === L + 1) { L = n; return { text: CONFIG.reply.accept(n), kind: "accept" }; }
  return { text: CONFIG.reply.refuse(L), kind: "refuse" };
}

function send(n) {
  sent++;
  append("→", CONFIG.wire.send(n, CONFIG.payloads[n - 1]), "");
  const r = receive(n);
  append("←", r.text, r.kind);
  render(r.text);
}

function append(dir, text, kind) {
  const li = document.createElement("li");
  li.innerHTML = `<span class="dir">${dir}</span><span class="${kind}"></span>`;
  li.lastChild.textContent = text;
  log.appendChild(li);
  log.scrollTop = log.scrollHeight;
}

function render(lastReply) {
  tray.innerHTML = "";
  CONFIG.payloads.forEach((payload, i) => {
    const n = i + 1;
    const b = document.createElement("button");
    b.className = "dgram" + (n <= L ? " done" : n === L + 1 ? " next" : "");
    b.textContent = CONFIG.wire.send(n, payload);
    b.addEventListener("click", () => send(n));
    tray.appendChild(b);
  });

  const r = document.createElement("button");
  r.className = "dgram reset";
  r.textContent = CONFIG.copy.reset;
  r.addEventListener("click", reset);
  tray.appendChild(r);

  $("verdict-l").textContent = CONFIG.copy.state(L);
  $("verdict-sent").textContent = CONFIG.copy.sent(sent);

  const reply = $("verdict-reply");
  reply.textContent = lastReply || CONFIG.copy.none;
  reply.className = "verdict " + (!lastReply ? "" : lastReply.startsWith("ok") ? "commits" : "stalls");

  $("takeaway").textContent = L === CONFIG.payloads.length
    ? CONFIG.copy.complete(L)
    : CONFIG.copy.caption(L);
}

reset();
</script>
</body>
</html>
